name: Python CI

on:
  workflow_call:
  pull_request:
    branches:
      - '**'

jobs:
  run_tests:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: '3.12'

    - name: Build
      run: uv build

    # This package must stay empty: ccx_keys is installed by edx-opaque-keys,
    # and shipping it here too would make the two distributions conflict.
    - name: Check that the wheel is empty and depends on edx-opaque-keys
      run: |
        unzip -l dist/*.whl
        if unzip -Z1 dist/*.whl | grep -v '\.dist-info/'; then
          echo "::error::The wheel contains files outside of its .dist-info directory"
          exit 1
        fi
        unzip -p dist/*.whl '*.dist-info/METADATA' | grep -x 'Requires-Dist: edx-opaque-keys>=5.0.0'
