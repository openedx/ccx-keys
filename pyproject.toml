[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-ccx-keys"
description = "Empty package: ccx_keys is now part of edx-opaque-keys"
readme = "README.rst"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
# The ccx_keys module and its key entry points are provided by edx-opaque-keys>=5.
# This distribution installs no code of its own.
dependencies = [
    "edx-opaque-keys>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/openedx/ccx-keys"

[tool.setuptools]
# Intentionally empty. Shipping a ccx_keys module here would conflict with edx-opaque-keys.
packages = []

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.semantic_release]
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"
